<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Cadastro de imóveis | Uryu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="site.css" />
    <script src="config.js"></script>
  </head>
  <body class="standalone">
    <header class="simple-header">
      <a href="index.html"><img src="logo-uryu.png" alt="Uryu Imóveis" /></a
      ><a href="index.html">Ver site ↗</a>
    </header>
    <main class="admin-shell">
      <h1>Cadastro de imóveis</h1>
      <p id="admin-message" role="status" aria-live="polite"></p>
      <form id="login-form" class="login-panel">
        <h2>Acesso administrativo</h2>
        <label
          >E-mail<input
            name="email"
            type="email"
            autocomplete="username"
            required /></label
        ><label
          >Senha<input
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="12"
            maxlength="256"
            required /></label
        ><button class="action">Entrar no painel</button>
      </form>
      <section id="admin-panel" hidden>
        <div class="admin-toolbar">
          <p id="admin-count"></p>
          <div>
            <button id="new-property" class="action">Cadastrar imóvel +</button>
            <button id="logout" class="text-button">Sair</button>
          </div>
        </div>
        <label
          >Buscar por título ou código<input
            id="admin-search"
            type="search"
            placeholder="Buscar imóvel"
        /></label>
        <div id="admin-list"></div>
      </section>
      <form id="editor" class="editor" hidden>
        <h2 id="editor-title">Novo imóvel</h2>
        <div class="editor-grid">
          <label
            >Código<input
              name="codigo"
              required
              maxlength="30"
              pattern="[A-Za-z0-9-]+"
              placeholder="URY-0001" /></label
          ><label class="wide"
            >Título<input name="titulo" required maxlength="150"
          /></label>
          <label
            >Tipo<select name="categoria">
              <option value="apartamento">Apartamento</option>
              <option value="casa">Casa</option>
              <option value="comercial">Comercial</option>
              <option value="terreno">Terreno</option>
            </select></label
          >
          <label
            >Finalidade<select name="negociacao">
              <option value="venda">Venda</option>
              <option value="aluguel">Aluguel</option>
            </select></label
          >
          <label
            >Estado do anúncio<select name="status">
              <option value="rascunho">Rascunho</option>
              <option value="publicado">Publicado neste ambiente</option>
              <option value="reservado">Reservado</option>
              <option value="vendido">Vendido</option>
              <option value="alugado">Alugado</option>
              <option value="arquivado">Arquivado</option>
            </select></label
          >
          <label
            >Preço · R$<input
              name="preco"
              type="number"
              min="0.01"
              step="0.01"
              required /></label
          ><label
            >Condomínio mensal · R$<input
              name="condominio"
              type="number"
              min="0"
              step="0.01"
              value="0"
              required /></label
          ><label
            >IPTU anual · R$<input
              name="iptu"
              type="number"
              min="0"
              step="0.01"
              value="0"
              required
          /></label>
          <label
            >UF<input
              name="estado"
              maxlength="2"
              minlength="2"
              value="SP"
              required /></label
          ><label>Cidade<input name="cidade" required maxlength="100" /></label
          ><label>Bairro<input name="bairro" required maxlength="100" /></label>
          <label
            >Área · m²<input
              name="tamanho"
              type="number"
              min="0.01"
              step="0.01"
              required /></label
          ><label
            >Quartos<input
              name="quartos"
              type="number"
              min="0"
              max="100"
              step="1"
              value="0"
              required /></label
          ><label
            >Banheiros<input
              name="banheiros"
              type="number"
              min="0"
              max="100"
              step="1"
              value="0"
              required /></label
          ><label
            >Vagas<input
              name="vagas"
              type="number"
              min="0"
              max="100"
              step="1"
              value="0"
              required
          /></label>
          <label
            >Fase<select name="fase">
              <option value="pronto">Pronto</option>
              <option value="obras">Em obras</option>
              <option value="planta">Na planta</option>
            </select></label
          ><label class="check-label"
            ><input name="destaque" type="checkbox" />Destacar no site</label
          >
          <label class="wide"
            >Descrição pública<textarea
              name="descricao"
              maxlength="10000"
              placeholder="Descreva os ambientes e diferenciais reais do imóvel."
            ></textarea></label
          ><label class="wide"
            >Características, separadas por vírgula<input
              name="caracteristicas"
              placeholder="Varanda, elevador, piscina" /></label
          ><label class="wide"
            >Endereço completo e notas internas · não aparecem no site<textarea
              name="private_notes"
              maxlength="10000"
            ></textarea>
          </label>
        </div>
        <h3>Fotos</h3>
        <p class="muted">
          A primeira foto será a capa. JPG, PNG ou WebP, até 12 MB por arquivo e
          30 fotos por imóvel.
        </p>
        <label
          >Adicionar fotos<input
            id="photo-upload"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            multiple
        /></label>
        <div id="upload-list" class="upload-list"></div>
        <p id="editor-message" role="status" aria-live="polite"></p>
        <div class="editor-actions">
          <button type="submit" class="action">Salvar imóvel</button
          ><button type="button" id="cancel-edit" class="action secondary">
            Voltar ao cadastro
          </button>
        </div>
      </form>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>
